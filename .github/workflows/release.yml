name: Build & Release Ophiuchi-rs (macOS & Windows — Standard & Tunnel Editions)

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-and-check:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - run: npm ci
      - run: npm run build
      - name: Test Standard Edition
        run: cargo test
        working-directory: src-tauri
      - name: Test Tunnel Edition (with opentunnel)
        run: cargo test --features tunnel
        working-directory: src-tauri

  bundle:
    name: Bundle ${{ matrix.edition }} (${{ matrix.platform }})
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: test-and-check
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: Standard
            platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - edition: Tunnel
            platform: macos-latest
            args: "--target aarch64-apple-darwin --features tunnel --config src-tauri/tauri.tunnel.conf.json"
          - edition: Standard
            platform: windows-latest
            args: ""
          - edition: Tunnel
            platform: windows-latest
            args: "--features tunnel --config src-tauri/tauri.tunnel.conf.json"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || 'x86_64-pc-windows-msvc' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "Ophiuchi-rs v__VERSION__"
          releaseBody: |
            ## Ophiuchi-rs v__VERSION__

            Cross-platform localhost SSL reverse proxy manager for **macOS** and **Windows** — available in two editions:

            - **Standard Edition (`Ophiuchi-rs`)**: Lightweight local-only HTTPS/WebSocket reverse proxy with Local Root CA and managed hosts sync (zero external tunnel dependencies).
            - **Tunnel Edition (`Ophiuchi-rs Tunnel`)**: Includes everything in Standard Edition **plus** built-in blind-TLS public tunnels powered by [`opentunnel`](https://github.com/anomalyco/opentunnel) (`https://<route>.<id>.opentunnel.xyz`).
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
